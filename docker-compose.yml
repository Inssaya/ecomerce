# Six containers, down from sixteen.
#
# Dropped in Phase 0: eight service containers, the gateway, RabbitMQ and
# Meilisearch. What the broker used to carry between containers is now a
# function call, and Postgres full-text search plus pgvector replaces the
# search engine — see docs/REBUILD-PLAN.md §2.

name: mostyle

networks:
  mostyle:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    networks: [mostyle]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mostyle}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-mostyle}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [mostyle]
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    networks: [mostyle]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  api:
    build:
      context: ./backend
    restart: unless-stopped
    networks: [mostyle]
    environment:
      APP_NAME: ${APP_NAME:-MoStyle}
      APP_URL: ${APP_URL:-http://localhost:3000}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mostyle}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      MINIO_ENDPOINT: minio:9000
      # Photographs are addressed on the storefront's own origin and proxied to
      # MinIO from there — a bare localhost:9000 is reachable from a browser but
      # not from the server rendering the page, which broke every image.
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:3000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-workshop@mostyle.ma}
      # These three were missing entirely: SMTP_USER/PASSWORD/TLS were readable
      # from .env but never reached the container, so real SMTP (anything but
      # Mailpit) silently sent as anonymous, unencrypted mail and every real
      # provider rejected it before this line existed.
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TLS: ${SMTP_TLS:-false}
      WHATSAPP_NUMBER: ${WHATSAPP_NUMBER:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      DELIVERY_FEE: ${DELIVERY_FEE:-30}
      FREE_DELIVERY_OVER: ${FREE_DELIVERY_OVER:-500}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build:
      context: ./frontend
      # Next bakes these into the build; they are not readable at run time.
      # Without them the ARGs default to empty, `siteUrl` becomes "" and
      # `new URL("")` throws in the language layout's generateMetadata — which
      # fails every prerendered page. The production overlay has always passed
      # these; this file did not, so only the production path ever built.
      args:
        INTERNAL_API_URL: http://api:8000
        NEXT_PUBLIC_SITE_URL: ${APP_URL:-http://localhost:3000}
        MEDIA_HOSTNAMES: ${MEDIA_HOSTNAMES:-}
        NEXT_PUBLIC_APP_NAME: ${APP_NAME:-MoStyle}
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${WHATSAPP_NUMBER:-}
    restart: unless-stopped
    networks: [mostyle]
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      INTERNAL_API_URL: http://api:8000
      NEXT_PUBLIC_APP_NAME: ${APP_NAME:-MoStyle}
      NODE_ENV: production
    depends_on:
      - api
    ports:
      - "3000:3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    networks: [mostyle]
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - web
      - api
    ports:
      - "80:80"
      - "443:443"
    profiles: [production]

  # Development only: catches every outgoing email at http://localhost:8025
  # instead of sending it. `docker compose --profile dev up`.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    networks: [mostyle]
    ports:
      - "1025:1025"
      - "8025:8025"
    profiles: [dev]
