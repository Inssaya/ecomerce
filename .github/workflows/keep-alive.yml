name: keep-alive

# Supabase pauses a free project after 7 days with no API traffic. /ready is
# a real request that touches Supabase and Redis, so a daily hit keeps the
# project awake and doubles as a check that the API is still up.
#
# This is NOT what keeps Render's free tier from sleeping. That needs a ping
# every few minutes, and the repository is private: every run is billed as at
# least one minute against 2,000 free minutes a month, so a 10-minute schedule
# (~4,300 runs) would exhaust them in about two weeks. An external pinger
# (cron-job.org, free) does that job instead.
#
# The default is the public Render address (it is not a secret). Set the
# repository secret API_READY_URL to override it, e.g. for a VM.

on:
  schedule:
    - cron: "0 6 * * *" # every day, 06:00 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /ready
        env:
          URL: ${{ secrets.API_READY_URL || 'https://mostyle-api.onrender.com/ready' }}
        run: |
          # --max-time is generous: a cold start can take about a minute.
          curl -fsS --retry 2 --max-time 90 "$URL" | tee /dev/stderr | grep -q '"status":"ready"'
