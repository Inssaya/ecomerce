name: keep-alive

# Render's free tier puts a web service to sleep after ~15 minutes without a
# request, and the first visitor afterwards waits 30-60 seconds for it to wake.
# /ready is a real request that also touches Supabase and Redis, so one ping
# every 10 minutes keeps the API awake and stops the free Supabase project
# from pausing after 7 idle days.
#
# GitHub's scheduler is best-effort: runs can arrive a few minutes late, so
# the interval leaves some margin under Render's 15.
#
# The default is the public Render address (it is not a secret). Set the
# repository secret API_READY_URL to override it, e.g. for a VM.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /ready
        env:
          URL: ${{ secrets.API_READY_URL || 'https://mostyle-api.onrender.com/ready' }}
        run: |
          # --max-time is generous: a cold start can take about a minute.
          curl -fsS --retry 2 --max-time 90 "$URL" | tee /dev/stderr | grep -q '"status":"ready"'
