# ── MoStyle ───────────────────────────────────────────────────────────────────
#
#   mostyle.ma      → the storefront (Next.js)
#   www.mostyle.ma  → redirect to the apex
#   /api/*          → the FastAPI monolith
#
# The four store subdomains are gone. REBUILD-PLAN §1: separating the catalogue
# into clothes/3dprint/electronics/glasses was static separation, and it
# fragmented the brand without reducing the choice paralysis it was meant to
# solve. One storefront that narrows itself around the visitor replaces them.
#
# For TLS: swap `listen 80` for `listen 443 ssl`, add the certificate paths, and
# let certbot --nginx manage renewal.

upstream web_upstream {
    server web:3000;
    keepalive 32;
}

upstream api_upstream {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name www.mostyle.ma;
    return 301 http://mostyle.ma$request_uri;
}

server {
    listen 80;
    server_name mostyle.ma;

    # Photographs are large and most visitors are on mobile data.
    client_max_body_size 16m;

    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
