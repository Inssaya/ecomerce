# ── MoStyle — subdomain routing ────────────────────────────────────────────────
#
# Production setup:
#   mostyle.ma            → frontend (homepage)
#   www.mostyle.ma        → redirect to mostyle.ma
#   clothes.mostyle.ma    → frontend /store/clothes (Next.js middleware handles it)
#   3dprint.mostyle.ma    → frontend /store/3dprint
#   electronics.mostyle.ma → frontend /store/electronics
#   glasses.mostyle.ma    → frontend /store/glasses
#   api.mostyle.ma        → gateway:8000
#
# For SSL: replace listen 80 with listen 443 ssl and add cert paths.
# Let's Encrypt certbot will manage certs via certbot --nginx.

upstream frontend_upstream {
    server frontend:3000;
    keepalive 32;
}

upstream gateway_upstream {
    server gateway:8000;
    keepalive 32;
}

# Redirect www → apex
server {
    listen 80;
    server_name www.mostyle.ma;
    return 301 http://mostyle.ma$request_uri;
}

# API subdomain → gateway
server {
    listen 80;
    server_name api.mostyle.ma;

    location / {
        proxy_pass http://gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}

# All store subdomains + apex → frontend
# Next.js middleware handles subdomain detection and rewrites to /store/[slug]
server {
    listen 80;
    server_name mostyle.ma *.mostyle.ma;

    # Pass /api/* to gateway so server-side Next.js fetch works
    location /api/ {
        proxy_pass http://gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Everything else → Next.js
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
