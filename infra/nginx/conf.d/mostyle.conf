# ── MoStyle ───────────────────────────────────────────────────────────────────
#
#   mostyle.ma        the storefront and the owner's panel
#   www.mostyle.ma    301 to the apex — one canonical hostname, always
#   media.mostyle.ma  the photographs, from MinIO
#   /api/*            the FastAPI monolith
#
# Serving both www and the apex would split every page's ranking across two
# URLs while the canonical tags name only one of them, so the redirect is not
# cosmetic.
#
# Replace `mostyle.ma` throughout if the domain changes, and re-run
# `infra/certbot-init.sh`.

upstream web_upstream {
    server web:3000;
    keepalive 32;
}

upstream api_upstream {
    server api:8000;
    keepalive 32;
}

upstream media_upstream {
    server minio:9000;
    keepalive 16;
}

# ── Port 80: the ACME challenge, and otherwise a push to TLS ──────────────────
server {
    listen 80;
    listen [::]:80;
    server_name mostyle.ma www.mostyle.ma media.mostyle.ma;

    # Certbot writes its proof here; this must stay reachable over plain HTTP
    # or renewal fails silently and the certificate expires.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://mostyle.ma$request_uri;
    }
}

# ── www → apex ────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.mostyle.ma;

    ssl_certificate     /etc/letsencrypt/live/mostyle.ma/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mostyle.ma/privkey.pem;

    return 301 https://mostyle.ma$request_uri;
}

# ── The photographs ───────────────────────────────────────────────────────────
#
# Through nginx rather than by publishing MinIO: it gets TLS, it gets caching,
# and the storage console is never exposed. Images are immutable once written —
# a new photograph is a new object key — so they can be cached hard.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name media.mostyle.ma;

    ssl_certificate     /etc/letsencrypt/live/mostyle.ma/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mostyle.ma/privkey.pem;

    location / {
        proxy_pass http://media_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}

# ── The shop ──────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mostyle.ma;

    ssl_certificate     /etc/letsencrypt/live/mostyle.ma/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mostyle.ma/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Only once the site is confirmed working on HTTPS — a browser that has
    # seen this will refuse plain HTTP for a year and cannot be talked out of
    # it.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Photographs are large and most visitors are on mobile data.
    client_max_body_size 16m;

    # ── The API ───────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The rate limiter reads the *last* entry of this header, because that
        # is the only one this proxy controls. Appending here is what makes
        # per-address limiting work at all.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # ── Next's build output ───────────────────────────────────────────────────
    #
    # Content-hashed filenames, so a year is safe and a deploy invalidates them
    # by changing the name. This is most of what makes a repeat visit instant.
    location /_next/static/ {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ── Everything else ───────────────────────────────────────────────────────
    location / {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
